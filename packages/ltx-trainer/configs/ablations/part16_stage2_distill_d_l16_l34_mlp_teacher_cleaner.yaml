# Experiment D: student uses t while the teacher uses the cleaner min(t, s).
model:
  model_path: "/workspace/code/controlsft_teacher/checkpoints/ltx-2.3/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: null
  training_mode: "full"
  load_checkpoint: "/workspace/code/controlsft_teacher/checkpoints/merged/model_weights_step_40000_fp32.safetensors"

training_strategy:
  name: "flexible"
  video:
    is_generated: true
    latents_dir: "latents"
    conditions: []
  clean_rgb_sra_loss_weight: 0.0
  representation_distillation:
    teacher_checkpoint: "/workspace/code/controlsft_teacher/checkpoints/merged/model_weights_step_40000_fp32.safetensors"
    teacher_conditions:
      - type: "reference"
        latents_dir: "reference_latents"
        probability: 1.0
    student_hidden_layer: 16
    teacher_hidden_layer: 34
    projector: "mlp"
    projector_hidden_dim: 1024
    projector_learning_rate: 2.0e-5
    loss_type: "cosine"
    loss_weight: 0.8
    warmup_steps: 100
    noise_mode: "teacher_cleaner"

optimization:
  learning_rate: 4.0e-6
  steps: 1000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "constant"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  preprocessed_data_root: "/workspace"
  manifest_path: "/workspace/code/controlsft_teacher/Controlsft/datasets/controlsft_teacher_250k/train.jsonl"
  num_dataloader_workers: 2

validation:
  samples: []
  interval: null
  generate_audio: false
  generate_video: false
  skip_initial_validation: true

checkpoints:
  interval: 200
  keep_last_n: 4
  precision: "bfloat16"
  save_training_state: "full"
  no_resume: true

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params:
    high_noise_probability: 0.0
    high_noise_min: 0.95

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: true
  project: "ltx-2.3-part16-control"
  entity: null
  tags: ["stage2-distill-d", "student16-teacher34", "teacher-cleaner", "no-control-student", "fsdp", "4node"]
  log_validation_videos: false

seed: 42
output_dir: "/workspace/code/controlsft_teacher/outputs/stage2_distill_d_l16_l34_mlp_teacher_cleaner"
